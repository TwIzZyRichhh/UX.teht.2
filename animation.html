<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Hunt – Sprite animation</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #222;
      }

      /* Background image (responsive: shrinks on small screens) */
      .stage {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 800 / 481;
        background: url("Kuvia/stage.png") center / cover no-repeat;
        overflow: hidden;
      }

      /* Dog: sprite sheet as background, walking across the grass */
      .dog {
        position: absolute;
        bottom: 6%;
        left: 0;
        width: 120px;
        height: 110px;
        background-image: url("Kuvia/sprite.png");
        background-position: 0 0;
        animation:
          doggowalk 0.5s steps(5) infinite,
          doggomove 8s linear infinite;
      }

      @keyframes doggowalk {
        from { background-position: 0 0; }
        to   { background-position: -600px 0; }
      }

      @keyframes doggomove {
        from { left: -120px; }
        to   { left: 100%; }
      }

      /* Duck: wings flap (sprite frames) while flying across the sky */
      .duck {
        position: absolute;
        top: 10%;
        left: 0;
        width: 80px;
        height: 80px;
        background-image: url("Kuvia/sprite.png");
        background-position: 0 -220px;
        animation:
          duckflap 0.3s steps(3) infinite,
          duckfly 6s linear infinite;
      }

      @keyframes duckflap {
        from { background-position: 0 -220px; }
        to   { background-position: -240px -220px; }
      }

      @keyframes duckfly {
        0%   { left: -80px; top: 40%; }
        50%  { top: 10%; }
        100% { left: 100%; top: 30%; }
      }

      /* Smaller sprites on phones */
      @media (max-width: 500px) {
        .dog, .duck { scale: 0.6; transform-origin: bottom left; }
      }
    </style>
  </head>

  <body>
    <div class="stage">
      <div class="duck"></div>
      <div class="dog"></div>
    </div>
  </body>
</html>
